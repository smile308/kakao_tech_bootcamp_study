plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'kr.adapterz'
version = '0.0.1-SNAPSHOT'

java {

	toolchain {
		languageVersion = JavaLanguageVersion.of(26)
	}
}

configurations {
	mockitoAgent
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'org.testcontainers:testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	implementation 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation('org.redisson:redisson-spring-boot-starter:4.6.1') {
		exclude group: 'org.redisson', module: 'redisson-spring-data-41'
	}
	implementation 'org.redisson:redisson-spring-data-40:4.6.1'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.springframework.boot:spring-boot-h2console'
	runtimeOnly 'com.mysql:mysql-connector-j'
	runtimeOnly 'org.flywaydb:flyway-mysql'
	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	testImplementation 'org.mockito:mockito-core'
	mockitoAgent('org.mockito:mockito-core') {
		transitive = false
	}
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
	jvmArgs(
			"-javaagent:${configurations.mockitoAgent.asPath}",
			"-Xshare:off"
	)
	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat "full"
	}
}

tasks.named('test') {
	systemProperty 'spring.profiles.active', 'test'
	useJUnitPlatform {
		excludeTags 'redis-integration', 'mysql-integration'
	}
	finalizedBy jacocoTestReport
}

tasks.register('redisTest', Test) {
	description = 'Runs integration tests against a Testcontainers Redis server.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'redis-integration'
	}
	shouldRunAfter test
}

tasks.register('mysqlTest', Test) {
	description = 'Runs schema and locking integration tests against a Testcontainers MySQL server.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'mysql-integration'
	}
	shouldRunAfter test
}

def coverageIncludes = [
	'kr/adapterz/springdatajpa/entity/**',
	'kr/adapterz/springdatajpa/auth/**',
	'kr/adapterz/springdatajpa/config/**',
	'kr/adapterz/springdatajpa/service/**',
	'kr/adapterz/springdatajpa/controller/**'
]

tasks.named('jacocoTestReport') {
	dependsOn test

	reports {
		html.required = true
		xml.required = true
		csv.required = false
	}

	classDirectories.setFrom(files(sourceSets.main.output.classesDirs.collect {
		fileTree(dir: it, include: coverageIncludes)
	}))
}

tasks.named('jacocoTestCoverageVerification') {
	dependsOn test

	classDirectories.setFrom(files(sourceSets.main.output.classesDirs.collect {
		fileTree(dir: it, include: coverageIncludes)
	}))

	violationRules {
		rule {
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.80
			}
		}
	}
}

check.dependsOn jacocoTestCoverageVerification
check.dependsOn tasks.named('redisTest')
check.dependsOn tasks.named('mysqlTest')
