name: Verify Backend AWS OIDC and SSM

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  verify-aws-oidc:
    name: Verify backend AWS authentication
    runs-on: ubuntu-latest

    steps:
      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Show authenticated AWS identity
        run: aws sts get-caller-identity

      - name: Send safe verification command to backend EC2
        id: send-command
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.DEPLOY_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Verify GitHub Actions to backend EC2 connection" \
            --parameters 'commands=["hostname","whoami","docker --version"]' \
            --query "Command.CommandId" \
            --output text)
          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"

      - name: Wait for backend EC2 command
        run: |
          aws ssm wait command-executed \
            --command-id "${{ steps.send-command.outputs.command_id }}" \
            --instance-id "${{ vars.DEPLOY_INSTANCE_ID }}"

      - name: Show backend EC2 command result
        if: always() && steps.send-command.outputs.command_id != ''
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.send-command.outputs.command_id }}" \
            --instance-id "${{ vars.DEPLOY_INSTANCE_ID }}" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
